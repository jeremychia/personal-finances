[tool.sqlfluff.core]
dialect = "bigquery"
templater = "dbt"
max_line_length = 120

[tool.sqlfluff.templater.dbt]
profiles_dir = "dbt"
project_dir = "dbt"

[tool.sqlfluff.indentation]
indent_unit = "space"
tab_space_size = 4

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finances-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "dbt-core>=1.12,<2.0",
  "dbt-bigquery>=1.12,<2.0",
  "gspread>=6.0",
  "scikit-learn>=1.4",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "sqlglot>=25.0",
  "db-dtypes>=1.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.0.0",
  "sqlfluff>=3.0.0",
  "sqlfluff-templater-dbt>=3.0.0",
  "black>=23.0.0",
]

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
